<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src = "../Lib/jquery.js"></script>

    <title>Login Page</title>
    <style>
		@font-face 
		{
    		font-family: "PageFont";
    		src: url("../Assets/Fonts/Jua-Regular.woff") format('woff');
		}
	</style>
    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-color:wheat ;
            margin: 0;
            padding: 0;
            justify-content: center;
        }
        .container {

            background-color:  rgba(150, 150, 150, 0.2);
            backdrop-filter: blur(25Px);

            border-color:  rgba(50, 50, 50, 0.2);
            border-style: solid;
            border-width: 25px;

            justify-content: space-between;

            width: 50%;
            position: relative;
            top: 40%;
            transform: translate(0, -50%);
            margin: auto;
            overflow:contain ;
            padding: 20px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
            justify-content: center;
        }
        h1 {
            text-align: center;
            color: #2b2020;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            font-family: 'PageFont';
            padding: 10px;
            border: none;
            border-radius: 25px;
            background: #8dafb2;
            color: white;
            font-size: 50px;
            cursor: pointer;
            background-color: rgba(0, 0, 255, 0.2);
        }
        button:hover {
            background-color: rgba(0, 0, 255, 0.5)
        }

        button:active
        {
            background-color: rgba(0, 0, 255, 0.2);
        }
        
        .split-container {
            display: flex;
            flex: 1;
            height: 100%;
        }
    </style>

    <script>
        $(document).ready(function() 
        {
            $('#Enter').click(function() 
            {
                event.preventDefault(); 

                var username = $('#username').val();
                var password = $('#password').val();

                console.log("64465");

                var validUsername = 'admin';
                var validPassword = '1234';

                if (username === validUsername && password === validPassword) {


                    window.location.href = "dashboard.html";
                    console.log("sdsd");
                }
                else {
                    $('#error-message').show();
                }
            });
        });
    </script>
</head>
<body style="background-color: wheat; font-family: 'PageFont';" >
    <div class="container">
        <center><label style="font-size: 80px;">Log In</label></center>
        <form id="loginForm" autocomplete="off">
            
            <center><label for="username" style="font-size: 30px;">Username</label></center><br>
            <input type="text" id="username" name="username" required style="font-size: 30px;">
            
          
            <center><label for="username" style="font-size: 30px;">Password</label></center><br>
            <input type="password" id="password" name="password" required style="font-size: 30px;"><br><br>
            <button id = "Enter">Login</button>
        </form>
        <p id="error-message" style="display:none; color:red;">Invalid username or password</p>
    </div>
</body>
</html>
